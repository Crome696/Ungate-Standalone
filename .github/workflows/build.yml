name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows
          - os: macos-latest
            script: build:mac
            artifact: macos
          - os: ubuntu-latest
            script: build:linux:x64
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            script: build:linux:arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y fakeroot libfuse2t64; then
            sudo apt-get install -y fakeroot libfuse2
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ungate-standalone-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (metadata)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute release notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          UNGATE_VERSION="$(node -e "console.log(require('./vendor/ungate/package.json').version)")"
          UNGATE_COMMIT="$(git -C vendor/ungate rev-parse HEAD)"
          echo "ungate_version=$UNGATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ungate_commit=$UNGATE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: ungate-standalone-windows
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: ungate-standalone-macos
          path: artifacts/macos

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: ungate-standalone-linux-x64
          path: artifacts/linux-x64

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: ungate-standalone-linux-arm64
          path: artifacts/linux-arm64

      - name: Create GitHub Release (with assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ungate Standalone ${{ github.ref_name }}
          body: |
            Bundled Ungate version: ${{ steps.meta.outputs.ungate_version }}
            Ungate submodule commit: ${{ steps.meta.outputs.ungate_commit }}
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux-x64/*
            artifacts/linux-arm64/*
