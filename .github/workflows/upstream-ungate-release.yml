name: Upstream Ungate Auto-Release

on:
  repository_dispatch:
    types: [ungate_release]

concurrency:
  group: ungate-upstream-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate payload
        id: payload
        shell: bash
        env:
          UNGATE_TAG: ${{ github.event.client_payload.ungate_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$UNGATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid or missing client_payload.ungate_tag: expected vX.Y.Z" >&2
            exit 1
          fi

          echo "ungate_tag=$UNGATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream tags
        shell: bash
        run: git -C vendor/ungate fetch --tags origin

      - name: Decide whether to skip
        id: decide
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
        run: |
          set -euo pipefail

          CURRENT_UNGATE_TAG="$(git -C vendor/ungate describe --tags --exact-match 2>/dev/null || true)"
          CURRENT_STANDALONE_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          if [[ ! "$CURRENT_STANDALONE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json does not contain a valid standalone semver" >&2
            exit 1
          fi

          if [ "$CURRENT_UNGATE_TAG" = "$UNGATE_TAG" ]; then
            CURRENT_STANDALONE_TAG="v${CURRENT_STANDALONE_VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${CURRENT_STANDALONE_TAG}" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The submodule and package are already updated, but the release tag is missing.
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "next_version=$CURRENT_STANDALONE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git -C vendor/ungate rev-parse --verify "refs/tags/${UNGATE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "Upstream tag ${UNGATE_TAG} was not found in vendor/ungate origin" >&2
            exit 1
          fi

          NEXT_VERSION="$(node scripts/bump-version.mjs --dry-run)"
          NEXT_TAG="v${NEXT_VERSION}"

          # If the standalone tag already exists, another run likely completed earlier.
          if git ls-remote --exit-code --tags origin "refs/tags/${NEXT_TAG}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git user
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update vendor/ungate submodule
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
        run: |
          set -euo pipefail

          git -C vendor/ungate checkout --detach "${UNGATE_TAG}"

      - name: Update upstream references
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
        run: node scripts/update-upstream-version.mjs --tag "$UNGATE_TAG"

      - name: Bump standalone version (minor)
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.bump == 'true'
        id: bump_version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.decide.outputs.next_version }}
        run: |
          set -euo pipefail

          NEXT_VERSION="$(node scripts/bump-version.mjs --write)"
          if [ "$NEXT_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version bump changed unexpectedly: expected ${EXPECTED_VERSION}, got ${NEXT_VERSION}" >&2
            exit 1
          fi
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit + create tag
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_VERSION: ${{ steps.decide.outputs.bump }}
          NEXT_VERSION: ${{ steps.decide.outputs.next_version }}
        run: |
          set -euo pipefail

          TAG="v${NEXT_VERSION}"

          if [ "$BUMP_VERSION" = "true" ]; then
            git add README.md package.json vendor/ungate
            git commit -m "chore: bump ungate to ${UNGATE_TAG} (standalone v${NEXT_VERSION})"
          fi
          git tag "${TAG}"

          git push origin "HEAD:${DEFAULT_BRANCH}"
          git push origin "${TAG}"

      - name: Trigger release build
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.decide.outputs.next_version }}
        run: |
          set -euo pipefail

          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "v${NEXT_VERSION}"
