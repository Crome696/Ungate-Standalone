name: Upstream Ungate Auto-Release

on:
  repository_dispatch:
    types: [ungate_release]

concurrency:
  group: ungate-upstream-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate payload
        id: payload
        shell: bash
        env:
          UNGATE_TAG: ${{ github.event.client_payload.ungate_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$UNGATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid or missing client_payload.ungate_tag: expected vX.Y.Z" >&2
            exit 1
          fi

          echo "ungate_tag=$UNGATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream tags
        shell: bash
        run: git -C vendor/ungate fetch --tags origin

      - name: Decide whether to skip
        id: decide
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_UNGATE_TAG="$(node scripts/resolve-upstream-tag.mjs)"
          CURRENT_STANDALONE_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          if [[ ! "$CURRENT_STANDALONE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json does not contain a valid standalone semver" >&2
            exit 1
          fi

          resolve_remote_tag_commit() {
            local tag="$1"
            local output

            if ! output="$(git ls-remote origin "refs/tags/${tag}^{}" 2>/dev/null)"; then
              echo "Could not inspect remote tag ${tag}" >&2
              return 1
            fi
            if [ -z "$output" ]; then
              if ! output="$(git ls-remote origin "refs/tags/${tag}" 2>/dev/null)"; then
                echo "Could not inspect remote tag ${tag}" >&2
                return 1
              fi
            fi
            printf '%s\n' "$output" | awk 'NR == 1 { print $1; exit }'
          }

          if [ "$CURRENT_UNGATE_TAG" = "$UNGATE_TAG" ]; then
            CURRENT_STANDALONE_TAG="v${CURRENT_STANDALONE_VERSION}"
            CURRENT_HEAD="$(git rev-parse HEAD)"
            CURRENT_TAG_COMMIT="$(resolve_remote_tag_commit "$CURRENT_STANDALONE_TAG")"
            if [ -n "$CURRENT_TAG_COMMIT" ]; then
              if ! git merge-base --is-ancestor "$CURRENT_TAG_COMMIT" "$CURRENT_HEAD" || \
                ! git diff --quiet "$CURRENT_TAG_COMMIT" "$CURRENT_HEAD" -- README.md package.json vendor/ungate; then
                echo "Standalone tag ${CURRENT_STANDALONE_TAG} does not match the current release state" >&2
                exit 1
              fi

              RELEASE_STATE="$(gh release view "$CURRENT_STANDALONE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(" ")' 2>/dev/null || true)"
              if [ "$RELEASE_STATE" = "false false" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              # The tag is correct, but its release is missing or not published yet.
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "bump=false" >> "$GITHUB_OUTPUT"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
              echo "next_version=$CURRENT_STANDALONE_VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The submodule and package are already updated, but the release tag is missing.
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "next_version=$CURRENT_STANDALONE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git -C vendor/ungate rev-parse --verify "refs/tags/${UNGATE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "Upstream tag ${UNGATE_TAG} was not found in vendor/ungate origin" >&2
            exit 1
          fi

          NEXT_VERSION="$(node scripts/bump-version.mjs --dry-run)"
          NEXT_TAG="v${NEXT_VERSION}"

          # A tag for the next version must not predate this requested update.
          NEXT_TAG_COMMIT="$(resolve_remote_tag_commit "$NEXT_TAG")"
          if [ -n "$NEXT_TAG_COMMIT" ]; then
            echo "Standalone tag ${NEXT_TAG} already exists before the requested upstream update" >&2
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git user
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update vendor/ungate submodule
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
        run: |
          set -euo pipefail

          git -C vendor/ungate checkout --detach "${UNGATE_TAG}"

          CHECKED_OUT_UNGATE_TAG="$(node scripts/resolve-upstream-tag.mjs)"
          if [ "$CHECKED_OUT_UNGATE_TAG" != "$UNGATE_TAG" ]; then
            echo "Checked out ${CHECKED_OUT_UNGATE_TAG}, expected ${UNGATE_TAG}" >&2
            exit 1
          fi

      - name: Update upstream references
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
        run: node scripts/update-upstream-version.mjs --tag "$UNGATE_TAG"

      - name: Bump standalone version (minor)
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.bump == 'true'
        id: bump_version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.decide.outputs.next_version }}
        run: |
          set -euo pipefail

          NEXT_VERSION="$(node scripts/bump-version.mjs --write)"
          if [ "$NEXT_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version bump changed unexpectedly: expected ${EXPECTED_VERSION}, got ${NEXT_VERSION}" >&2
            exit 1
          fi
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit + create tag
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          UNGATE_TAG: ${{ steps.payload.outputs.ungate_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_VERSION: ${{ steps.decide.outputs.bump }}
          TAG_EXISTS: ${{ steps.decide.outputs.tag_exists }}
          NEXT_VERSION: ${{ steps.decide.outputs.next_version }}
        run: |
          set -euo pipefail

          TAG="v${NEXT_VERSION}"

          if [ "$BUMP_VERSION" = "true" ]; then
            git add README.md package.json vendor/ungate
            git commit -m "chore: bump ungate to ${UNGATE_TAG} (standalone v${NEXT_VERSION})"
          elif ! git diff --quiet -- README.md; then
            UNEXPECTED_CHANGES="$(git diff --name-only | grep -v '^README\.md$' || true)"
            if [ -n "$UNEXPECTED_CHANGES" ]; then
              echo "Unexpected changes found in the no-bump release path:" >&2
              printf '%s\n' "$UNEXPECTED_CHANGES" >&2
              exit 1
            fi
            git add README.md
            git commit -m "chore: synchronize Ungate upstream reference to ${UNGATE_TAG}"
          fi
          if [ "$TAG_EXISTS" != "true" ]; then
            git tag "${TAG}"
          fi

          git push origin "HEAD:${DEFAULT_BRANCH}"
          if [ "$TAG_EXISTS" != "true" ]; then
            git push origin "${TAG}"
          fi

          resolve_remote_tag_commit() {
            local tag="$1"
            local output

            if ! output="$(git ls-remote origin "refs/tags/${tag}^{}" 2>/dev/null)"; then
              echo "Could not inspect remote tag ${tag}" >&2
              return 1
            fi
            if [ -z "$output" ]; then
              if ! output="$(git ls-remote origin "refs/tags/${tag}" 2>/dev/null)"; then
                echo "Could not inspect remote tag ${tag}" >&2
                return 1
              fi
            fi
            printf '%s\n' "$output" | awk 'NR == 1 { print $1; exit }'
          }

          REMOTE_TAG_COMMIT="$(resolve_remote_tag_commit "$TAG")"
          LOCAL_TAG_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_EXISTS" = "true" ]; then
            if ! git merge-base --is-ancestor "$REMOTE_TAG_COMMIT" "$LOCAL_TAG_COMMIT" || \
              ! git diff --quiet "$REMOTE_TAG_COMMIT" "$LOCAL_TAG_COMMIT" -- README.md package.json vendor/ungate; then
              echo "Remote tag ${TAG} does not match the release state after verification" >&2
              exit 1
            fi
          elif [ "$REMOTE_TAG_COMMIT" != "$LOCAL_TAG_COMMIT" ]; then
            echo "Remote tag ${TAG} points to ${REMOTE_TAG_COMMIT}, expected ${LOCAL_TAG_COMMIT}" >&2
            exit 1
          fi

      - name: Trigger release build
        if: steps.decide.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.decide.outputs.next_version }}
        run: |
          set -euo pipefail

          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "v${NEXT_VERSION}"
